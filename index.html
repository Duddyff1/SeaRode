<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaRode Logo Generator & Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap');
:root{--ink:#07100f;--cream:#f7f3ec;--gold:#e2bf75;--gold2:#f1d696;--muted:#9fa7a4;--card:#101817;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#fff;font-family:"DM Sans",sans-serif;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
.container{max-width:800px;width:100%;text-align:center}
h1{font-family:"Playfair Display",serif;color:var(--gold);margin-bottom:10px;font-size:32px}
p{color:var(--muted);margin-bottom:40px}
.previewGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-bottom:40px}
.logoCard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;position:relative}
.logoCard.dark{background:#050b0a}
.logoCard.light{background:#f7f3ec;color:#07100f}
.logoSvgWrapper{margin-bottom:16px}
.label{font-size:12px;letter-spacing:2px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:auto}
.goldBtn{background:var(--gold);border:0;border-radius:28px;padding:12px 24px;font-weight:700;color:#131a18;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
.goldBtn:hover{background:var(--gold2)}
@media(max-width:600px){.previewGrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="container">
  <h1>SeaRode Brand Logo Suite</h1>
  <p>Custom vector-style emblem concepts crafted for your restaurant. Copy or use these scalable assets directly in your web project.</p>

  <div class="previewGrid">
    
    <!-- Concept 1: Modern Luxury Seal -->
    <div class="logoCard dark">
      <div class="logoSvgWrapper">
        <svg width="180" height="70" viewBox="0 0 180 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 35C15 23.9543 23.9543 15 35 15H145C156.046 15 165 23.9543 165 35C165 46.0457 156.046 55 145 55H35C23.9543 55 15 46.0457 15 35Z" stroke="#e2bf75" stroke-width="2"/>
          <path d="M45 25L52 45H57L62 32L67 45H72L79 25" stroke="#e2bf75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="92" y="41" font-family="'Playfair Display', serif" font-size="22" font-style="italic" font-weight="700" fill="#f7f3ec">SeaRode</text>
        </svg>
      </div>
      <div class="label">Dark Background Version</div>
    </div>

    <!-- Concept 2: Light Elegant Seal -->
    <div class="logoCard light">
      <div class="logoSvgWrapper">
        <svg width="180" height="70" viewBox="0 0 180 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="35" cy="35" r="22" stroke="#07100f" stroke-width="2"/>
          <path d="M26 30L30 42H33L36 34L39 42H42L46 30" stroke="#07100f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="68" y="41" font-family="'Playfair Display', serif" font-size="22" font-style="italic" font-weight="700" fill="#07100f">SeaRode</text>
        </svg>
      </div>
      <div class="label" style="color:#555">Light Background Version</div>
    </div>

  </div>

  <button class="goldBtn" onclick="navigator.clipboard.writeText(`<div style='font-family:Playfair Display,serif;font-size:32px;font-style:italic;color:#e2bf75;font-weight:600;'>SeaRode</div>`); alert('HTML Logo snippet copied to clipboard!');">Copy HTML Logo Snippet</button>
</div>

</body>
</html>
